# Sloppatrol profile for Adventure Guide Forever, a WoW: Forever addon in Lua 5.1 with Python tooling.
# The checks are the fast ones from AGENTS.md, set by hand: the repo has no package.json to infer
# them from. A run checkout is clean: the specs need the test corpus
# that gen_corpus.py builds, and `check_generated.py --offline` is left out because it needs the
# gitignored tools/.cache.
agent: claude
prepare: ["python3 tools/gen_corpus.py"]
cleanup: [stylua .]
checks:
  - { name: format, run: "stylua --check ." }
  - { name: lint, run: "luacheck ." }
  - { name: typecheck, run: "tools/typecheck.sh" }
  - { name: specs, run: "for s in tests/*_spec.lua; do luajit \"$s\" || exit 1; done", tests: true }
  - { name: tools, run: "ruff format --check tools && ruff check tools" }
  - { name: changelog, run: "python3 tools/changelog.py --check" }
  - { name: credits, run: "python3 tools/forever_tools/credits.py --check" }
  - { name: rules, run: "python3 tools/repo_rules.py" }
focus: [Core/**, Planning/**, UI/**, Integrations/**]
ignore: [Data/**, Locales/**, Libs/**, types/**, tools/forever_tools/**]
guards: { maxFiles: 8, maxLines: 400 }
