name: Refresh game data

# Opens a PR with regenerated data when wago.tools lists a newer Forever or Classic Era build, or QuestieDB a
# newer release.
# The specs run here first; GitHub holds the CI of a PR that GITHUB_TOKEN opened, so the ci job approves it.
# Daily: beta builds have shipped several times a week. A failed run on main reports itself as an issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      FOREVER_CORE: forever-core
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates with its own `token` input.
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Pinned inputs CI already downloaded, such as frozen dumps; each file is keyed by its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py', 'tools/diff_forever.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - name: Pin the newest Forever, Classic Era and QuestieDB releases
        id: pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/refresh_pins.py
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        if: steps.pins.outputs.changed == 'true'
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - name: Regenerate
        if: steps.pins.outputs.changed == 'true'
        run: |
          python3 tools/gen_quests.py
          python3 tools/diff_forever.py
          python3 tools/gen_zoneart.py
          python3 tools/gen_corpus.py
          python3 tools/catalogue_revision.py --write
      - if: steps.pins.outputs.changed == 'true'
        run: python3 tools/check_generated.py --offline
      - name: Generator tests
        if: steps.pins.outputs.changed == 'true'
        run: |
          python3 tools/gen_quests_test.py
          python3 tools/gen_corpus_test.py
          python3 tools/gen_zoneart_test.py
          python3 tools/diff_forever_test.py
          python3 tools/refresh_pins_test.py
          python3 tools/catalogue_revision_test.py
      # The specs include the golden routes (tests/golden): a route the new data changes fails the run.
      - name: Lua checks, specs and the planner bench
        if: steps.pins.outputs.changed == 'true'
        run: |
          luacheck .
          python3 -m tools.forever_tools.specs
          luajit -joff tests/plan_bench.lua
      - if: steps.pins.outputs.changed == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.pins.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/refresh
          title: "data: refresh game data"
          commit-message: "data: refresh game data (${{ steps.pins.outputs.summary }})"
          body: |
            Regenerated `Data/Geometry.lua`, `Data/Forever.lua` and `Data/ZoneArt.lua`, and ran the specs on the test corpus built from the new QuestieDB pin (never committed), after moving the pins: ${{ steps.pins.outputs.summary }}.

            Before merging, read the diff of `Data/Geometry.lua` for maps, flight masters, crossings or trainer roles that appeared, moved or dropped out, and `Data/Forever.lua` for lands and quests Forever added or lost. The specs and the golden routes passed on this data, so a changed route would have failed the run. Add a `CHANGELOG.md` line under Unreleased saying what a player would notice.

            The workflow that opened this PR also approved its CI, so the required checks run without a maintainer's approval.

  # GitHub holds every pull_request run on a PR that GITHUB_TOKEN opened until someone with write access approves
  # it: the held run has no jobs and no log, and it ends as a failure when the PR closes. Approve the PR commit's held
  # runs (CI and Speedpatrol) so its required checks run on their own. GitHub creates them a few seconds after the push.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Approve the PR's held workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          for _ in $(seq 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
            held=$(printf '%s\n' "$runs" | awk '$2 == "action_required" { print $1 }')
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
            done
            if [ -n "$runs" ] && [ -z "$held" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The pull_request runs for $SHA were not created or not approved"
          exit 1

  # A refresh that fails every day unnoticed is how the data falls behind: keep one open issue saying so.
  report:
    needs: [refresh, ci]
    # The first attempt stays quiet: retry-refresh.yml re-runs it, and only a failed re-run is reported.
    if: failure() && github.run_attempt > 1 && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The data refresh failed, so the bundled data may be behind the client: $RUN_URL

          Read the error in that run. A generator or spec that rejects the new client data is fixed from that data: update the expected value, or re-base a golden route the data explains with \`AGF_UPDATE_GOLDEN=1\`, and keep the check exact. \`AGENTS.md\` describes the refresh. Close this issue once a run passes."
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
