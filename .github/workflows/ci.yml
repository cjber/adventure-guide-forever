name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify client visual proof
        env:
          VISUAL_BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || 'origin/main' }}
        run: python3 -m tools.forever_tools.visual_proof --base "$VISUAL_BASE"

  deadcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tool version lives in this checkout's tools/toolchain.json, which the action reads, installs and
      # verifies; the Python tools are tools/pyproject.toml's dev group, resolved in tools/uv.lock.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua stylua
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # The test corpus is never committed (QuestieDB carries no licence): it is built from the sha-pinned release,
      # downloaded once into tools/.cache and kept here between runs (only its own inputs, keyed by the pins in the
      # generators, so the tracker source and the other dumps never come back stale).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/.cache/questiedb-*
            tools/.cache/SkillLine-*.csv
            tools/.cache/Faction-*.csv
          key: corpus-${{ runner.os }}-${{ hashFiles('tools/gen_corpus.py', 'tools/gen_quests.py') }}
      - run: python3 tools/gen_corpus.py
      - run: luacheck .
      - run: python3 -m tools.forever_tools.assets
      - run: python3 -m tools.forever_tools.specs
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/sync.py check
      - run: python3 tools/forever_sim/fetch.py
      - run: luajit tools/forever_sim/run.lua
      # A screenshot older than the headless scene it is drawn from (docs/screenshots/scenes.sha256). On this
      # repository's own data/refresh PR (and a manual run on that branch) a scene moved by new data only warns,
      # since the bot can't render; the images are rendered again after it merges.
      - run: python3 tools/check_screenshots.py
        env:
          SCREENSHOTS_STALE_WARN: ${{ (github.event_name == 'pull_request' && github.head_ref == 'data/refresh' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'data/refresh') }}
      # Call counts and the 3 ms frame budget, with three times the measured time allowed for a shared runner.
      - run: luajit -joff tests/plan_bench.lua
      - name: Check generated localisation template
        run: python3 tools/phrases.py --check
      - name: Check the published API against its docs
        run: python3 tools/check_api_docs.py
      - name: Check generator rendering from pinned fixtures
        run: |
          python3 tools/gen_quests_test.py
          python3 tools/gen_zoneart_test.py
          python3 tools/diff_forever_test.py
          python3 tools/refresh_pins_test.py
      - name: The vendored Shortest Path types match upstream at the pinned sha
        run: |
          sha=$(sed -n 's/^local SPF_SHA = "\(.*\)"/\1/p' tests/contract_spec.lua)
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -sSfL "https://raw.githubusercontent.com/cjber/shortest-path-forever/$sha/types/API.lua" \
            | diff <(tail -n +2 tests/fixtures/spf_types_API.lua) -
      - name: Tests use repository paths only
        run: "! grep -rnE '/home/|~/|drive/proj' tests/"
      - run: uv run --project tools --frozen --group dev ruff check tools
      - run: uv run --project tools --frozen --group dev ruff format --check tools
      - run: stylua --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # tools/gen_corpus_test.py, among the unit tests typecheck.sh runs, reads the built corpus.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua luals
      # The test corpus is never committed (QuestieDB carries no licence): it is built from the sha-pinned release,
      # downloaded once into tools/.cache and kept here between runs (only its own inputs, keyed by the pins in the
      # generators, so the tracker source and the other dumps never come back stale).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/.cache/questiedb-*
            tools/.cache/SkillLine-*.csv
            tools/.cache/Faction-*.csv
          key: corpus-${{ runner.os }}-${{ hashFiles('tools/gen_corpus.py', 'tools/gen_quests.py') }}
      - run: python3 tools/gen_corpus.py
      - run: tools/typecheck.sh

  generated-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py', 'tools/diff_forever.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - name: Regenerate pinned data in a scratch tree
        run: python3 tools/check_generated.py
      # Data/Credits.lua and the README and store thanks blocks are generated from THIRD_PARTY.md (WFA-31).
      - run: python3 tools/forever_tools/credits.py --check

  project-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check
      - run: python3 tools/repo_rules.py

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --project tools --frozen --group dev actionlint
      - run: uv run --project tools --frozen --group dev zizmor --offline .github

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: gitleaks
      - name: Gitleaks over the full history
        run: gitleaks git --redact --no-banner .

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every loaded file present, no development folders, the smoke spec passes on it).
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every commit and tag for the version, without old file contents.
          filter: blob:none
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # LuaJIT and luac5.1 at tools/toolchain.json's pins, which the packager's smoke spec runs on.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      # The smoke spec runs on the packaged files with tests/ laid over them, the built corpus with it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/.cache/questiedb-*
            tools/.cache/SkillLine-*.csv
            tools/.cache/Faction-*.csv
          key: corpus-${{ runner.os }}-${{ hashFiles('tools/gen_corpus.py', 'tools/gen_quests.py') }}
      - run: python3 tools/gen_corpus.py
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/fetch.py
      - run: python3 tools/check_package.py
