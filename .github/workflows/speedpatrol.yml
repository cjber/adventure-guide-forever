name: Speedpatrol

# Times this PR against its base branch in alternating A/B rounds on one runner, comments the table on the PR and
# fails on a regression. Only the planner bench runs here: its
# prepare step builds the test corpus in each checkout.
on:
  pull_request:
    # labeled re-runs the timing when the "speedpatrol: accept" label is added; naming types replaces the defaults.
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  speedpatrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # LuaJIT at tools/toolchain.json's pin, which the bench and the specs run on.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      - uses: agent-labs-dev/speedpatrol@6f86e2ea61e004c78c18de41ad052c9f55ab5a19 # v0
        with:
          benchmarks: planner.plan
          fail-on-regression: true
          rounds: 3
          # The npm package's own version, which this action takes as a plain string: tools/toolchain.json pins the
          # same one, but the action cannot read the manifest.
          package: speedpatrol@0.2.0
